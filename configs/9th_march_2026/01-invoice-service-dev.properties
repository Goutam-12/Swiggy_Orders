spring.data.redis.password=gQAAAAAAAw03AAIgcDI0ODBlZmZjOTgxYWU0OGE5ODNiZWYxNTg1Njg3ZTkyNA
spring.data.redis.ssl.enabled=true
spring.cache.type=redis

# ACTUATOR

# Expose actuator endpoints
management.endpoints.web.exposure.include=*
//management.endpoints.web.exposure.exclude=beans,mappings

//management.endpoint.shutdown.enabled=true

# Show detailed health information
management.endpoint.health.show-details=always

# Actuator base path
management.endpoints.web.base-path=/actuator


# Eureka Server URL
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Register with Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.categoryService.register-health-indicator=true
resilience4j.circuitbreaker.instances.categoryService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.categoryService.sliding-window-size=10
resilience4j.circuitbreaker.instances.categoryService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.categoryService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.categoryService.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.categoryService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.categoryService.automatic-transition-from-open-to-half-open-enabled=true

